      target: '대상은 부산을 방문한 외국인 관광객입니다. 부산 거주자는 조사 대상에서 제외합니다.',
      one: '별도 표시가 없으면 한 개만 선택해 주세요.',
      upto: '최대 {n}개', all: '모두 선택', otherPh: '직접 입력', maxMsg: '최대 {n}개까지 선택할 수 있어요',
      submit: '제출하기', thanks: '응답해 주셔서 감사합니다.', again: '새 응답', empty: '응답한 문항이 없습니다. 그래도 제출할까요?',
      sent: '✓ 전송 완료', saved: '이 기기에 저장했어요. 인터넷이 연결되면 자동 전송됩니다.' },
    q: {
      q1: { t: '이번 부산 여행에서 방문한 곳은 어디입니까?' },
      q2: { t: '이번 부산 여행 중 음식점·카페 직원과 소통이 어려웠던 적은 몇 번입니까?', n: '한 번 방문한 가게에서 여러 차례 어려움이 있었어도 1회로 세어 주세요.', end: '설문이 여기서 끝납니다. 제출하기를 눌러 주세요. 감사합니다!' },
      q3: { t: '어떤 내용을 주고받을 때 어려움이 있었습니까?' },
      q4: { t: '소통의 어려움 때문에 실제로 어떤 일이 있었습니까?' },
      q5: { t: '직원과 소통할 때 어떤 지원이 도움이 되겠습니까?' }
    }
  }
};

// ===== 언어 선택 =====
const $ = (id) => document.getElementById(id);
const params = new URLSearchParams(location.search);
function detectLang() {
  const saved = params.get('lang') || SL.store.get('sl_vlang', '');
  if (L[saved]) return saved;
  const nav = (navigator.language || 'en').toLowerCase();
  if (nav.startsWith('ja')) return 'ja';
  if (nav.startsWith('zh')) return /tw|hk|mo|hant/.test(nav) ? 'zh-TW' : 'zh-CN';
  if (nav.startsWith('vi')) return 'vi';
  return 'en';
}
let lang = detectLang();
let survey, rid = SL.rid('V');

const T = (q) => {
  const tx = L[lang].q[q.id] || {};
  return { t: tx.t, n: tx.n, end: tx.end, o: tx.o || q.opts.map((x) => x.v) };
};

function snapshot() {
  // 언어를 바꿔도 이미 고른 답 유지
  const s = {};
  document.querySelectorAll('#survey input').forEach((el, i) => (s[i] = el.type === 'text' ? el.value : el.checked));
  return s;
}
function restore(s) {
  document.querySelectorAll('#survey input').forEach((el, i) => {
    if (!(i in s)) return;
    if (el.type === 'text') el.value = s[i]; else { el.checked = s[i]; if (el.type === 'radio' && s[i]) el.dataset.was = '1'; }
  });
}
function applyLang(keep) {
  const snap = keep ? snapshot() : null;
  document.documentElement.lang = lang;
  const ui = L[lang].ui;
  document.querySelectorAll('[data-i]').forEach((el) => (el.textContent = ui[el.dataset.i] || ''));
  $('langbar').innerHTML = LANGS.map(([k, n]) => `<button type="button" data-l="${k}" class="${k === lang ? 'on' : ''}">${n}</button>`).join('');
  $('langbar').querySelectorAll('button').forEach((b) => b.addEventListener('click', () => {
    lang = b.dataset.l; SL.store.set('sl_vlang', lang); applyLang(true);
  }));
  survey = new SL.Survey($('survey'), Q, T, ui);
  survey.render();
  if (snap) { restore(snap); survey.update(); }
}

$('submit').addEventListener('click', async () => {
  const { data, answered } = survey.collect();
  if (!answered && !confirm(L[lang].ui.empty)) return;
  const row = Object.assign({
    '응답번호': rid, '조사일': SL.now().date, '시간': SL.now().time,
    '조사자': params.get('by') || '', '조사상권': params.get('area') || '', '응답언어': LANGS.find((x) => x[0] === lang)[1]
  }, data);
  $('submit').disabled = true;
  const r = await SL.send('관광객', row);
  $('submit').disabled = false;
  const m = $('sendmsg');
  if (r.left || r.nourl) { m.textContent = L[lang].ui.saved; m.className = 'status warn'; }
  else { m.textContent = L[lang].ui.sent; m.className = 'status ok'; }
  $('app').hidden = true; $('done').hidden = false; window.scrollTo(0, 0);
});
$('again').addEventListener('click', () => {
  rid = SL.rid('V'); applyLang(false);
  $('done').hidden = true; $('app').hidden = false; window.scrollTo(0, 0);
});
applyLang(false);
</script>
